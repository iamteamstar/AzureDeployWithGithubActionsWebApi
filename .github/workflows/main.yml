name: Build and deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: AzureDeployWithGithubActionsWebApi
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Locate csproj
        id: csproj
        run: |
          CSPROJ=$(find . -name "*.csproj" | head -1)
          echo "Bulunan proje: $CSPROJ"
          echo "path=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.csproj.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.csproj.outputs.path }}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{ steps.csproj.outputs.path }}" --configuration Release --no-build --output ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
