name: Build and deploy to Azure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: AzureDeployWithGithubActionsWebApi
  DOTNET_VERSION: '8.0.x'   # API ve test projesinin TargetFramework'ü ile AYNI olmalı

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Locate API csproj (test projesini hariç tut)
        id: csproj
        run: |
          CSPROJ=$(find . -name "*.csproj" ! -name "*Test*" ! -name "*Tests*" | head -1)
          echo "Yayınlanacak proje: $CSPROJ"
          echo "path=$CSPROJ" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish "${{ steps.csproj.outputs.path }}" --configuration Release --no-build --output ./publish

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
